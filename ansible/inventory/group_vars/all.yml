---
# Variables shared by every host in the platform — ALL-LOCAL EDITION.
# No cloud: every logical host maps to 127.0.0.1 with a local connection.
admin_user: gadour
ssh_user: gadour

# Local single-host plan (replaces the old 10.0.2.0/24 private-cloud IP plan).
ips:
  ctrl_node: "127.0.0.1"
  git_cicd: "127.0.0.1"
  k8s_cp: "127.0.0.1"
  k8s_wk1: "127.0.0.1"
  k8s_wk2: "127.0.0.1"
  mlflow: "127.0.0.1"
  fastapi: "127.0.0.1"
  postgres: "127.0.0.1"
  prometheus: "127.0.0.1"
  grafana: "127.0.0.1"
  training: "127.0.0.1"
  testing: "127.0.0.1"

# PostgreSQL (VM08) used by the app AND as the MLflow backend store.
postgres_host: "{{ ips.postgres }}"
postgres_app_db: mlops
postgres_app_user: mlops_app
postgres_app_password: "changeme_app"
postgres_mlflow_db: mlflow
postgres_mlflow_user: mlflow
postgres_mlflow_password: "changeme_mlflow"

# MLflow tracking server (VM06).
mlflow_host: "{{ ips.mlflow }}"
mlflow_port: 5000
mlflow_tracking_uri: "http://{{ mlflow_host }}:{{ mlflow_port }}"

# Model registry contract used by FastAPI.
model_name: maintenance-model
model_stage: Production

# Monitoring scrape config shared bits.
prometheus_host: "{{ ips.prometheus }}"
grafana_host: "{{ ips.grafana }}"
node_exporter_port: 9100
postgres_exporter_port: 9187

# Docker mirrors / registries (override per environment if needed).
docker_registry: ""
