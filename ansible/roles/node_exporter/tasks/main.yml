---
- name: Create node_exporter user
  user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
  become: true

- name: Download node_exporter
  unarchive:
    src: https://github.com/prometheus/node_exporter/releases/download/v1.6.1/node_exporter-1.6.1.linux-amd64.tar.gz
    dest: /tmp
    remote_src: true
  become: true

- name: Install node_exporter binary
  copy:
    src: /tmp/node_exporter-1.6.1.linux-amd64/node_exporter
    dest: /usr/local/bin/node_exporter
    mode: "0755"
    remote_src: true
  become: true

- name: Create node_exporter systemd unit
  copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network.target

      [Service]
      User=node_exporter
      Group=node_exporter
      ExecStart=/usr/local/bin/node_exporter \
        --web.listen-address=0.0.0.0:{{ node_exporter_port }}
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  become: true

- name: Start and enable node_exporter
  systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
  become: true
