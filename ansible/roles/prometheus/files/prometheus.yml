global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# All-local: single-host lab (docker/compose.local.yml). No private-network IPs.
scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets:
          - localhost:9100

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - localhost:9187

  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8000
