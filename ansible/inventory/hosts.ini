# Ansible inventory for the MLOps platform.
# Generated from the spec section 2 IP plan by scripts/generate-inventory.py.
# Private IPs are static on the 10.0.2.0/24 subnet; SSH uses the admin user.
# EDIT the ansible_user below if your GCP ssh-keys metadata user differs.

[all:vars]
ansible_user = admin
ansible_become = true

[ctrl]
ctrl-node ansible_host=10.0.2.10

[git-cicd]
git-cicd ansible_host=10.0.2.11

[k8s]
k8s-cp  ansible_host=10.0.2.20
k8s-wk1 ansible_host=10.0.2.21
k8s-wk2 ansible_host=10.0.2.22

[k8s_masters]
k8s-cp ansible_host=10.0.2.20

[k8s_workers]
k8s-wk1 ansible_host=10.0.2.21
k8s-wk2 ansible_host=10.0.2.22

[mlflow]
mlflow ansible_host=10.0.2.30

[fastapi]
fastapi ansible_host=10.0.2.31

[postgres]
postgres ansible_host=10.0.2.40

[prometheus]
prometheus ansible_host=10.0.2.50

[grafana]
grafana ansible_host=10.0.2.51

[training]
training-env ansible_host=10.0.2.60

[testing]
testing-env ansible_host=10.0.2.61

[all:children]
ctrl
git-cicd
k8s
mlflow
fastapi
postgres
prometheus
grafana
training
testing
