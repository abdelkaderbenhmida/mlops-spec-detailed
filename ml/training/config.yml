# Configuration for the predictive maintenance ML pipeline.
# Generated synthetic maintenance data (ml/data/raw/maintenance.csv).

mlflow:
  tracking_uri: "http://10.0.2.30:5000"
  experiment_name: "predictive_maintenance"
  model_name: "maintenance-model"
  artifact_path: "model"

data:
  raw_path: "ml/data/raw/maintenance.csv"
  processed_dir: "ml/data/processed"
  processed_file: "ml/data/processed/maintenance_processed.csv"
  encoders_file: "ml/data/processed/encoders.joblib"
  test_size: 0.2
  random_state: 42
  target: "failure_next_30_days"

features:
  numeric:
    - age_months
    - operating_hours
    - maintenance_history
    - sensor_temp
    - sensor_vibration
    - sensor_pressure
    - sensor_humidity
  categorical:
    - equipment_type

model:
  n_estimators: 200
  max_depth: 12
  min_samples_split: 10
  min_samples_leaf: 4
  max_features: "sqrt"
  class_weight: "balanced"
  n_jobs: -1

evaluation:
  probability_threshold: 0.5
  max_f1_regression: 0.01