# All-local Prometheus configuration: scrapes services on the local host
# (docker/compose.local.yml). No cloud/private-network IPs.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: mlops
    platform: mlops-platform

rule_files:
  - /etc/prometheus/rules/alert.rules.yml

scrape_configs:
  - job_name: node_exporter
    static_configs:
      - targets:
          - 'localhost:9100'

  - job_name: mlflow
    static_configs:
      - targets:
          - 'localhost:5000'

  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'localhost:8000'

  - job_name: postgres_exporter
    static_configs:
      - targets: ['localhost:9187']
