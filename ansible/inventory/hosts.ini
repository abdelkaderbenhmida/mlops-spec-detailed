# Ansible inventory for the MLOps platform — ALL-LOCAL EDITION.
# Generated from the local single-host plan by scripts/generate-inventory.py.
# Every logical host maps to 127.0.0.1 with a local connection; roles execute
# on the local machine (use `make validate` for syntax checks only).
# EDIT the ansible_user below if your local user differs.

[all:vars]
ansible_user = gadour
ansible_connection = local
ansible_become = true

[ctrl]
ctrl-node ansible_host=127.0.0.1

[git-cicd]
git-cicd ansible_host=127.0.0.1

[k8s-cp]
k8s-cp ansible_host=127.0.0.1

[k8s-wk1]
k8s-wk1 ansible_host=127.0.0.1

[k8s-wk2]
k8s-wk2 ansible_host=127.0.0.1

[mlflow]
mlflow ansible_host=127.0.0.1

[fastapi]
fastapi ansible_host=127.0.0.1

[postgres]
postgres ansible_host=127.0.0.1

[prometheus]
prometheus ansible_host=127.0.0.1

[grafana]
grafana ansible_host=127.0.0.1

[training-env]
training-env ansible_host=127.0.0.1

[testing-env]
testing-env ansible_host=127.0.0.1

